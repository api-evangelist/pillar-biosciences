name: Pillar Biosciences packages
description: >-
  Pillar Biosciences publishes NO API client SDK in any package registry. What it
  does publish is a small set of first-party open-source BIOINFORMATICS tools on
  GitHub — CNV callers, a methylation pipeline and batch-effect notebooks — none
  of which are distributed through a package registry and none of which is a
  client library for a Pillar API. They are recorded here because they are real,
  first-party, dated, licensed software artifacts; they are deliberately NOT
  wired as `type: SDKs`, because crediting an sdk_count for research pipelines
  that wrap no API would be false credit.
