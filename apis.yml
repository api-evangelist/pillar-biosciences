  detail: >-
    Pillar sells NGS panels and the PiVAT analysis app, and PiVAT's own product
    page names its integration surface as bioinformatics FILE formats (FASTQ,
    BAM, VCF, PDF) rather than an API; the PiVAT app host answers HTTP 200 with
    the same 1,535-byte React SPA shell for /openapi.json and every other unknown
    path, and 403 for the whole /.well-known/ space, so there is no developer
    portal, contract or reference to read anywhere.
