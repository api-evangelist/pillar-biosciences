aid: pillar-biosciences
name: Pillar Biosciences
description: >-
  Pillar Biosciences is a Natick, Massachusetts molecular diagnostics company,
  founded in 2014, that develops targeted next-generation sequencing (NGS)
  solutions for precision oncology. Its proprietary SLIMamp (Stem-Loop Inhibition
  Mediated amplification) chemistry enables highly multiplexed, single-tube PCR
  library preparation from as little as 2.5 ng of DNA, and its oncoReveal panel
  portfolio covers solid tumour tissue, liquid biopsy, haematologic malignancy,
  BRCA/HRD/methylation and inherited disease testing, alongside an InheritReveal
  line and a VersaTile machine-learning panel-design platform. Sequencing data is
  processed by PiVAT (Pillar Variant Analysis Toolkit), a secondary-analysis
  pipeline available as a local install or a HIPAA-scoped cloud deployment, with
  optional OncoKB-powered tertiary reporting. Pillar ships both research-use-only
  kits and an IVD product line, and raised a $34.5M round led by Illumina in 2025.
  Pillar publishes no public API, SDK or developer program; PiVAT's integration
  surface is bioinformatics file formats (FASTQ, BAM, VCF, PDF) behind a
  customer login.
